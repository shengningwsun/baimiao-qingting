<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#163b36"><meta name="description" content="一座两层乡间住宅与开阔的院落。自由漫游房屋、阳台与庭院。"><title>白庙晴庭 · 3D 房屋漫游</title><link rel="icon" type="image/png" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="白庙晴庭"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head>
<body class="ui-collapsed"><main id="app"><canvas id="world" aria-label="可交互的三维房屋与庭院" tabindex="0"></canvas>
<header><div class="brand"><span class="brand-mark">庭</span><div><strong>白庙晴庭</strong><span>HOUSE & GARDEN</span></div><i></i><div class="project-label">两层乡居 · 实景漫游<small>13 × 10 m / 双层住宅</small></div></div><div class="top-actions"><button id="light" title="切换日光与黄昏">☀ <span>晴日</span></button><button id="quality" title="切换画质">精细画质</button><button id="install-app" title="安装或保存离线">↓</button><button id="update-app" title="检查软件更新" hidden>检查更新</button><button id="share-app" title="分享漫游">↗</button><button id="help" title="操作说明">?</button><button id="fullscreen" title="全屏">⛶</button></div></header>
<div id="location"><span id="location-dot"></span><span id="location-text">庭院全景</span><small id="floor-text">室外</small></div>
<aside id="map-panel" class="glass"><div class="map-heading"><span>空间导览</span><div><button data-map="0" class="active">1F</button><button data-map="1">2F</button><button id="map-toggle" aria-label="收起导览图">−</button></div></div><canvas id="minimap" width="460" height="390" aria-label="房屋平面导览图，点击房间前往"></canvas><div class="map-caption">点击房间前往 <span>▲ 当前位置</span></div></aside>
<nav id="places" class="glass" aria-label="快速前往"><span class="nav-label">前往</span><button data-place="garden" class="active">庭院</button><button data-place="living">客厅</button><button data-place="dining">餐厨</button><button data-place="upstairs">二楼</button><button data-place="balcony">阳台</button></nav>
<div id="bottom"><div id="controls" class="glass"><button id="orbit" class="active">◉ <span>建筑观赏</span></button><button id="walk">♧ <span>自由步行</span></button><div class="divider"></div><button id="plans">▱ <span>原始图纸</span></button><button id="home" title="回到初始视角">⌂</button></div><div id="hint">拖动旋转 · 滚轮缩放</div></div>
<div id="crosshair" hidden></div><div id="toast" role="status"></div><div id="touch-controls" hidden><div id="joystick" aria-label="行走摇杆"><span></span></div><button id="sprint" type="button" aria-label="开启步行加速" aria-pressed="false">加速 <span>1×</span></button><div class="touch-look">拖动右侧转动视角</div></div>
<dialog id="info-dialog"><button class="close" aria-label="关闭">×</button><div id="dialog-content"></div></dialog>
<div id="loading" role="status" aria-live="polite">正在加载高清家具…</div><div id="fatal" hidden><h2>暂时无法开启 3D 画面</h2><p>请使用支持 WebGL 2 的新版浏览器，并开启硬件加速。</p><button id="retry-scene">重新尝试</button></div>
<div id="offline-status" role="status" hidden></div><button id="menu-toggle" aria-label="展开或收起操作菜单" aria-expanded="false" aria-controls="places controls map-panel">☰ 菜单</button></main><script type="module" src="./app.js"></script><script src="./mobile-shell.js"></script></body></html>
